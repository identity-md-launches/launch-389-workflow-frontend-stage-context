[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

# Pinned compiler. The hook uses transient storage (tstore/tload), which needs Cancun.
solc = "0.8.26"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"

# No shell access and no filesystem access from tests or scripts.
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 24
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
